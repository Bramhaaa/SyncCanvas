services:
  postgres:
    image: postgres:16-alpine
    container_name: synccanvas-postgres
    environment:
      POSTGRES_DB: synccanvas
      POSTGRES_USER: synccanvas
      POSTGRES_PASSWORD: synccanvas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synccanvas -d synccanvas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: synccanvas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
