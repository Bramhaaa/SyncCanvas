name: Multi-Node Convergence Chaos IT

on:
  workflow_dispatch:
    inputs:
      duration_ms:
        description: "Chaos duration in milliseconds"
        required: false
        default: "30000"

jobs:
  multinode-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - name: Start multi-node stack (Postgres + Redis + server1 + server2 + Caddy)
        run: docker compose --profile multinode up -d --build --wait

      - name: Run multi-node chaos convergence test
        env:
          CHAOS_DURATION_MS: ${{ inputs.duration_ms || '30000' }}
        run: node --experimental-strip-types e2e/multinode/chaos.mjs

      - name: Tear down stack
        if: always()
        run: docker compose --profile multinode down -v
